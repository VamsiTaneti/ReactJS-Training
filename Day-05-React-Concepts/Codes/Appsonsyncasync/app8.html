<html>
    <head>
        <title>Asynchronus Communication using: Promise()</title>
    </head>
    <body>
        <script>
            function action1(){
                return new Promise((resolve,reject)=>{
                    console.log("Action1 is being executed");
                    resolve()
                });
            }
            function action2(){
                return new Promise((resolve,reject)=>{
                    console.log("Action2 is being executed");
                    resolve()
                });
            }
            function action3(){
                return new Promise((resolve,reject)=>{
                    console.log("Action3 is being executed");
                    resolve()
                });
            }

            action1()
            .then(()=>{action2()})
            .then(()=>{action3()})
        </script>
    </body>
</html>
